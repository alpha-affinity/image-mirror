---
name: Mirror third-party images

# Copies third-party container images into ghcr.io/alpha-affinity/mirror/*,
# byte-for-byte (same digest), so an upstream deleting or privatising its
# repository cannot break the consumers that pin these digests.
#
# To add or bump an image: add/edit a matrix entry and push to main. Consumers
# then reference `ghcr.io/alpha-affinity/mirror/<name>:<tag>@<digest>` with the
# SAME digest as the source. A single-source copy preserves the image config,
# so its build date (and any age gate keyed on it) is unchanged.
#
# Licence compliance: before copying, the workflow archives the Corresponding
# Source for the exact commit the image was built from (its
# org.opencontainers.image.revision label) as an asset on a release of THIS
# repository, `<name>-<tag>`, and refuses to publish the image without it. Once
# archived, the source no longer depends on the upstream repo existing. No
# manual step on a bump: a new tag gets its own release on the next run.
#
# The packages are connected to this repository, which is why it is public and
# holds nothing but this workflow and a README. Packages created from a public
# repository start public; the last step fails if one ever is not.
on:
  push:
    branches: [main]
  schedule:
  # Weekly re-assert: recreates a mirror tag if it was ever deleted.
  - cron: 17 4 * * 1
  workflow_dispatch:

permissions:
  contents: write  # source-archive releases
  packages: write

concurrency:
  group: mirror-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
        # pgsty/silo — maintained AGPL-3.0 fork of MinIO community edition.
        # Unmodified. source_repo is the upstream GitHub repo the revision label
        # refers to; its tarball at that commit is archived here.
        - name: silo
          source: docker.io/pgsty/silo
          tag: RELEASE.2026-09-16T00-00-00Z
          digest: sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
          source_repo: pgsty/silo
    env:
      SOURCE: ${{ matrix.image.source }}@${{ matrix.image.digest }}
      TARGET: ghcr.io/alpha-affinity/mirror/${{ matrix.image.name }}:${{ matrix.image.tag }}
      DIGEST: ${{ matrix.image.digest }}
      SOURCE_REPO: ${{ matrix.image.source_repo }}
      RELEASE: ${{ matrix.image.name }}-${{ matrix.image.tag }}
    steps:
    - uses: docker/setup-buildx-action@v4.2.0
    - uses: docker/login-action@v4.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Never publish an AGPL binary whose Corresponding Source we do not hold.
    # Idempotent: an existing archive for this exact revision is reused, so
    # once archived nothing here needs the upstream repo again.
    - name: Archive the Corresponding Source as release ${{ env.RELEASE }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        rev="$(docker buildx imagetools inspect "$SOURCE" --format '{{json .Image}}' \
          | jq -r '[.. | objects | select(has("Labels")) | .Labels["org.opencontainers.image.revision"] // empty] | unique | .[]')"
        if [ "$(printf '%s\n' "$rev" | grep -c .)" -ne 1 ]; then
          echo "::error::expected exactly one org.opencontainers.image.revision across platforms, got: ${rev:-none}"
          exit 1
        fi
        asset="${SOURCE_REPO//\//-}-$rev.tar.gz"
        # grep without -q, sed not head: an early-exiting reader SIGPIPEs the
        # writer, which pipefail would turn into a false failure.
        if gh release view "$RELEASE" --json assets --jq '.assets[].name' 2>/dev/null | grep -xF "$asset" >/dev/null; then
          echo "Corresponding Source already archived: $asset"
        else
          curl -fsSL --retry 3 -o "$asset" "https://codeload.github.com/$SOURCE_REPO/tar.gz/$rev"
          # GitHub names the tarball's top-level directory <repo>-<full sha>.
          top="$(tar -tzf "$asset" | sed -n 1p)"
          case "$top" in
            *-"$rev"/) ;;
            *) echo "::error::archive top-level entry '$top' does not name revision $rev"; exit 1 ;;
          esac
          sum="$(sha256sum "$asset" | cut -d' ' -f1)"
          notes="Corresponding Source for ghcr.io/alpha-affinity/mirror image $RELEASE (unmodified).
        Upstream: https://github.com/$SOURCE_REPO at commit $rev.
        Image: $SOURCE
        sha256($asset) = $sum"
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" "$asset"
          else
            gh release create "$RELEASE" "$asset" --target main --latest=false \
              --title "$RELEASE source" --notes "$notes"
          fi
          echo "Archived Corresponding Source: $asset ($sum)"
        fi
        echo "Release: https://github.com/$GH_REPO/releases/tag/$RELEASE"
    # A single-source `imagetools create` copies the index and every child
    # manifest (platforms and attestations) unchanged. Idempotent.
    - name: Copy ${{ matrix.image.name }} into ghcr
      run: docker buildx imagetools create --tag "$TARGET" "$SOURCE"
    - name: Verify the mirror kept the source digest
      run: |
        set -euo pipefail
        got="$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest.Digest}}' | tr -d '"')"
        if [ "$got" != "$DIGEST" ]; then
          echo "::error::$TARGET resolved to $got, expected $DIGEST"
          exit 1
        fi
    - name: Verify the mirror is anonymously pullable
      run: |
        set -euo pipefail
        anon="$(mktemp -d)"
        if ! DOCKER_CONFIG="$anon" docker buildx imagetools inspect "$TARGET@$DIGEST" >/dev/null; then
          echo "::error::$TARGET is not anonymously pullable. Set the ghcr package visibility to Public (one-time)."
          exit 1
        fi
