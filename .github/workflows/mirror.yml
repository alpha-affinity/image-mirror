---
name: Mirror third-party images

# Copies third-party container images into ghcr.io/alpha-affinity/mirror/*,
# byte-for-byte (same digest), so an upstream deleting or privatising its
# repository cannot break the consumers that pin these digests.
#
# To add or bump an image: add/edit a matrix entry and push to main. Consumers
# then reference `ghcr.io/alpha-affinity/mirror/<name>:<tag>@<digest>` with the
# SAME digest as the source. A single-source copy preserves the image config,
# so its build date (and any age gate keyed on it) is unchanged.
#
# Licence compliance: before copying, the workflow checks that the entry's
# `source_repo` (our fork) carries the release tag at the commit the image was
# built from, so every binary served here has its Corresponding Source held by
# us. On a version bump, pin the new release in the fork first (forks share
# objects with upstream, so the commit resolves; the ref is what keeps it):
#   gh api -X POST repos/<source_repo>/git/refs \
#     -f ref=refs/tags/<tag> -f sha=<image revision label>
# The gate's error message prints this command with the values filled in.
#
# The packages are connected to this repository, which is why it is public
# and holds nothing but this workflow and a README. A new package is created
# private on its first push; set it to Public once (Package settings → Danger
# Zone). The last step fails until that is done.
on:
  push:
    branches: [main]
  schedule:
  # Weekly re-assert: recreates a mirror tag if it was ever deleted.
  - cron: 17 4 * * 1
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
        # pgsty/silo — maintained AGPL-3.0 fork of MinIO community edition.
        # Unmodified; upstream: https://github.com/pgsty/silo
        # source_repo is OUR fork holding the Corresponding Source (AGPL §6).
        # `tag` doubles as the git tag that must exist there.
        - name: silo
          source: docker.io/pgsty/silo
          tag: RELEASE.2026-09-16T00-00-00Z
          digest: sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
          source_repo: alpha-affinity/silo
    env:
      SOURCE: ${{ matrix.image.source }}@${{ matrix.image.digest }}
      TARGET: ghcr.io/alpha-affinity/mirror/${{ matrix.image.name }}:${{ matrix.image.tag }}
      DIGEST: ${{ matrix.image.digest }}
      SOURCE_REPO: ${{ matrix.image.source_repo }}
      TAG: ${{ matrix.image.tag }}
    steps:
    - uses: docker/setup-buildx-action@v4.2.0
    - uses: docker/login-action@v4.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Never publish an AGPL binary whose Corresponding Source we do not hold.
    # The image's revision label names the exact commit; our fork must carry
    # the release tag at that commit. Checked by REF, not by commit lookup:
    # forks share an object store with upstream, so a bare commit lookup
    # succeeds even when only upstream has it — a ref in our fork is what
    # keeps it alive if upstream disappears.
    - name: Verify ${{ env.SOURCE_REPO }} holds the Corresponding Source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        revs="$(docker buildx imagetools inspect "$SOURCE" --format '{{json .Image}}' \
          | jq -r '[.. | objects | select(has("Labels")) | .Labels["org.opencontainers.image.revision"] // empty] | unique | .[]')"
        if [ "$(printf '%s\n' "$revs" | grep -c .)" -ne 1 ]; then
          echo "::error::expected exactly one org.opencontainers.image.revision across platforms, got: ${revs:-none}"
          exit 1
        fi
        remedy="pin it: \`gh api -X POST repos/$SOURCE_REPO/git/refs -f ref=refs/tags/$TAG -f sha=$revs\`, then re-run"
        if ! ref="$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"; then
          echo "::error::$SOURCE_REPO has no tag $TAG — $remedy"
          exit 1
        fi
        read -r type sha <<<"$ref"
        if [ "$type" = tag ]; then
          sha="$(gh api "repos/$SOURCE_REPO/git/tags/$sha" --jq .object.sha)"
        fi
        if [ "$sha" != "$revs" ]; then
          echo "::error::$SOURCE_REPO tag $TAG is $sha but the image was built from $revs — $remedy"
          exit 1
        fi
        echo "Corresponding Source: https://github.com/$SOURCE_REPO/tree/$revs"
    # A single-source `imagetools create` copies the index and every child
    # manifest (platforms and attestations) unchanged. Idempotent.
    - name: Copy ${{ matrix.image.name }} into ghcr
      run: docker buildx imagetools create --tag "$TARGET" "$SOURCE"
    - name: Verify the mirror kept the source digest
      run: |
        set -euo pipefail
        got="$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest.Digest}}' | tr -d '"')"
        if [ "$got" != "$DIGEST" ]; then
          echo "::error::$TARGET resolved to $got, expected $DIGEST"
          exit 1
        fi
    - name: Verify the mirror is anonymously pullable
      run: |
        set -euo pipefail
        anon="$(mktemp -d)"
        if ! DOCKER_CONFIG="$anon" docker buildx imagetools inspect "$TARGET@$DIGEST" >/dev/null; then
          echo "::error::$TARGET is not anonymously pullable. Set the ghcr package visibility to Public (one-time)."
          exit 1
        fi
