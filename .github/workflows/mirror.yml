---
name: Mirror third-party images

# Copies third-party container images into ghcr.io/alpha-affinity/mirror/*,
# byte-for-byte (same digest), so an upstream deleting or privatising its
# repository cannot break the consumers that pin these digests.
#
# To add or bump an image: add/edit a matrix entry and push to main. Consumers
# then reference `ghcr.io/alpha-affinity/mirror/<name>:<tag>@<digest>` with the
# SAME digest as the source. A single-source copy preserves the image config,
# so its build date (and any age gate keyed on it) is unchanged.
#
# The packages are connected to this repository, which is why it is public
# and holds nothing but this workflow and a README. A new package is created
# private on its first push; set it to Public once (Package settings → Danger
# Zone). The last step fails until that is done.
on:
  push:
    branches: [main]
  schedule:
  # Weekly re-assert: recreates a mirror tag if it was ever deleted.
  - cron: 17 4 * * 1
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
        # pgsty/silo — maintained AGPL-3.0 fork of MinIO community edition.
        # Unmodified; source: https://github.com/pgsty/silo
        - name: silo
          source: docker.io/pgsty/silo
          tag: RELEASE.2026-09-16T00-00-00Z
          digest: sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    env:
      SOURCE: ${{ matrix.image.source }}@${{ matrix.image.digest }}
      TARGET: ghcr.io/alpha-affinity/mirror/${{ matrix.image.name }}:${{ matrix.image.tag }}
      DIGEST: ${{ matrix.image.digest }}
    steps:
    - uses: docker/setup-buildx-action@v4.2.0
    - uses: docker/login-action@v4.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # A single-source `imagetools create` copies the index and every child
    # manifest (platforms and attestations) unchanged. Idempotent.
    - name: Copy ${{ matrix.image.name }} into ghcr
      run: docker buildx imagetools create --tag "$TARGET" "$SOURCE"
    - name: Verify the mirror kept the source digest
      run: |
        set -euo pipefail
        got="$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest.Digest}}' | tr -d '"')"
        if [ "$got" != "$DIGEST" ]; then
          echo "::error::$TARGET resolved to $got, expected $DIGEST"
          exit 1
        fi
    - name: Verify the mirror is anonymously pullable
      run: |
        set -euo pipefail
        anon="$(mktemp -d)"
        if ! DOCKER_CONFIG="$anon" docker buildx imagetools inspect "$TARGET@$DIGEST" >/dev/null; then
          echo "::error::$TARGET is not anonymously pullable. Set the ghcr package visibility to Public (one-time)."
          exit 1
        fi
